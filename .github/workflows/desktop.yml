name: Desktop app

# On each operating system: the service the desktop app runs (portable PostgreSQL, the
# agent bridge, the frozen PyInstaller build), then the Tauri window around it and its
# unsigned installers, with the third-party notices they carry. A second job installs
# each installer on a fresh runner, uses the app, quits and uninstalls it.
# Nothing is published here: release.yml calls this workflow for the owner's tag and
# attaches the installers to a draft release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (the release tag)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the workspace UI
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - run: uv sync --locked --extra durable --extra workflow --group desktop
      - name: Pinned portable PostgreSQL (checksum verified)
        run: uv run --no-sync python scripts/fetch-postgres.py --out target/postgres --archive target/postgres-archive/postgres.txz
      - name: Sidecar tests with real PostgreSQL
        env:
          RUNWEAVE_TEST_POSTGRES_BINARIES: target/postgres
        run: uv run --no-sync pytest tests/test_desktop.py tests/test_desktop_release.py -q
      - name: Freeze with PyInstaller and smoke-test the build
        run: uv run --no-sync python scripts/build-sidecar.py
      - name: Linux libraries for Tauri (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - name: Rust toolchain from rust-toolchain.toml
        working-directory: desktop/src-tauri
        run: rustup show active-toolchain || rustup toolchain install
      - name: Third-party notices and the Rust SBOM (the Tauri build checks bundled resources exist)
        shell: bash
        run: |
          mkdir -p target/notices
          uv export --locked --no-dev --no-emit-project --extra durable --extra workflow --format requirements-txt > target/notices/requirements.txt
          uv run --no-sync python scripts/third-party-notices.py --out target/notices
      - name: Rust format, lint and tests
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the app and its unsigned installers
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/sidecar/build.json
            target/sidecar/smoke.json
            target/notices/THIRD_PARTY_NOTICES.txt
            target/notices/runweave-desktop-rust.cdx.json
            desktop/src-tauri/target/release/bundle/

  install-check:
    name: Install check (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - name: A developer environment with runweave and the sample agent
        run: |
          uv sync --locked
          uv pip install --python .venv ./examples/sample-agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: artifact
      - name: Install, use, quit and uninstall (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
          xvfb-run -a uv run --no-sync python scripts/check-desktop.py --python .venv/bin/python --installer "$(ls artifact/desktop/src-tauri/target/release/bundle/deb/*.deb)" --output target/desktop-check.json
      - name: Install, use, quit and uninstall (macOS)
        if: runner.os == 'macOS'
        run: uv run --no-sync python scripts/check-desktop.py --python .venv/bin/python --installer "$(ls artifact/desktop/src-tauri/target/release/bundle/dmg/*.dmg)" --output target/desktop-check.json
      - name: Install, use, quit and uninstall (Windows, NSIS installer)
        if: runner.os == 'Windows'
        shell: bash
        run: uv run --no-sync python scripts/check-desktop.py --python .venv/Scripts/python.exe --installer "$(ls artifact/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)" --output target/desktop-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-check-${{ matrix.os }}
          path: target/desktop-check.json
