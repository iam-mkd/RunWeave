name: Desktop app

# On each operating system: the service the desktop app runs (portable PostgreSQL, the
# agent bridge, the frozen PyInstaller build), then the Tauri window around it and its
# unsigned installers. Nothing is published here; release.yml attaches installers to a
# draft release only for the owner's tag.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sidecar:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build the workspace UI
        run: npm --prefix frontend ci && npm --prefix frontend run build
      - run: uv sync --locked --extra durable --extra workflow --group desktop
      - name: Pinned portable PostgreSQL (checksum verified)
        run: uv run --no-sync python scripts/fetch-postgres.py --out target/postgres --archive target/postgres-archive/postgres.txz
      - name: Sidecar tests with real PostgreSQL
        env:
          RUNWEAVE_TEST_POSTGRES_BINARIES: target/postgres
        run: uv run --no-sync pytest tests/test_desktop.py -q
      - name: Freeze with PyInstaller and smoke-test the build
        run: uv run --no-sync python scripts/build-sidecar.py
      - name: Linux libraries for Tauri (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - name: Rust toolchain from rust-toolchain.toml
        working-directory: desktop/src-tauri
        run: rustup show active-toolchain || rustup toolchain install
      - name: Rust format, lint and tests
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build the app and its unsigned installers
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/sidecar/build.json
            target/sidecar/smoke.json
            desktop/src-tauri/target/release/bundle/
