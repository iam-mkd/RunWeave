name: Local React workspace

on:
  push:
    paths: ['frontend/**', 'src/**', 'tests/test_workspace.py', 'tests/contract/**', 'pyproject.toml', 'uv.lock', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'src/**', 'tests/test_workspace.py', 'tests/contract/**', 'pyproject.toml', 'uv.lock', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run --no-sync pytest tests/test_workspace.py -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - run: npm run build:prototype
        working-directory: frontend
      - run: npm run test:prototype
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-screenshots
          path: frontend/test-results/**/*.png
