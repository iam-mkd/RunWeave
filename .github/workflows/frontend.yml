name: Local React workspace

on:
  push:
    paths: ['frontend/**', 'src/**', 'migrations/**', 'examples/sample-agent/**', 'scripts/smoke-database.py', 'tests/test_workspace.py', 'tests/contract/**', 'pyproject.toml', 'uv.lock', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'src/**', 'migrations/**', 'examples/sample-agent/**', 'scripts/smoke-database.py', 'tests/test_workspace.py', 'tests/contract/**', 'pyproject.toml', 'uv.lock', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The approvals checks run on a throwaway database created on this server.
      RUNWEAVE_SMOKE_POSTGRES_URL: postgresql+asyncpg://runweave_smoke:synthetic-test-password@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: runweave_smoke
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runweave_smoke -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked
      - run: uv pip install -r requirements-durable.txt
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: uv run --no-sync pytest tests/test_workspace.py -q
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:browser
        working-directory: frontend
      - run: npm run build:prototype
        working-directory: frontend
      - run: npm run test:prototype
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-screenshots
          path: frontend/test-results/**/*.png
