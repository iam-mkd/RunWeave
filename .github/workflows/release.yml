name: Release

# Every pull request builds and verifies the release artifacts, then installs the built wheel
# on fresh Windows, macOS and Linux runners and uses it. Publishing (PyPI, npm, GHCR and a
# draft GitHub Release) runs only when the owner pushes a v* tag or starts this workflow by
# hand, and only through the protected `release` environment, so each publishing job waits
# for the owner's approval.
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.2.0)
        required: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: The tag matches the package versions
        if: github.event_name != 'pull_request'
        run: |
          python - <<'EOF'
          import json, os, re, tomllib
          # v1.2.3 or v1.2.3-rc.1; Python spells the second 1.2.3rc1.
          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:-rc\.(\d+))?", tag)
          assert match, f"{tag} is not vX.Y.Z or vX.Y.Z-rc.N"
          python = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          node = json.load(open("sdk/typescript/package.json"))["version"]
          expected = match[1] + (f"rc{match[2]}" if match[2] else "")
          assert (python, node) == (expected, tag[1:]), (tag, python, node)
          EOF
      - name: Build the workspace UI and bundle it into the package
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          python scripts/bundle-workspace-ui.py
      - name: Build the wheel and sdist
        run: uv build --out-dir dist
      - name: Pack the TypeScript SDK
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run build
          npm pack --pack-destination ../../dist
      - name: SBOMs (CycloneDX) for the Python package, the workspace UI and the SDK
        run: |
          mkdir -p target
          uv export --locked --no-dev --no-emit-project --extra durable --extra workflow --format requirements-txt > target/requirements.txt
          uvx --from cyclonedx-bom==9.0.0 cyclonedx-py requirements target/requirements.txt --output-file dist/runweave-python.cdx.json
          (cd frontend && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file ../dist/runweave-workspace-ui.cdx.json)
          (cd sdk/typescript && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-file ../../dist/runweave-agent-sdk.cdx.json)
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Build the service image
        run: |
          docker build -t runweave-service:release .
          mkdir -p target/image
          docker save runweave-service:release | gzip > target/image/runweave-service.tar.gz
      - name: The image serves the UI and runs a durable approval through compose.yaml
        run: uv run --locked python scripts/check-container.py --compose --image runweave-service:release --output target/release/compose-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-image
          path: target/image/runweave-service.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compose-check
          path: target/release/compose-check.json

  install-check:
    # The exact wheel that would be published, installed into a fresh environment with no
    # Node and no clone, the two ways the quickstart gives: pip and `uv tool install`.
    name: Install the wheel (${{ matrix.os }}, ${{ matrix.installer }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        installer: [pip, uv-tool]
        include:
          - installer: pip
            python: '3.11'
          - installer: uv-tool
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: init, eval, bench, shadow and the workspace from the installed wheel
        shell: bash
        run: |
          wheel=$(ls dist/runweave-*-py3-none-any.whl)
          uv run --no-project --with httpx==0.28.1 python scripts/check-release.py --wheel "$wheel" --installer ${{ matrix.installer }} --skip-typescript --output target/release/install-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-check-${{ matrix.os }}-${{ matrix.installer }}
          path: target/release/install-check.json

  publish-pypi:
    needs: [build, install-check]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Verify the checksums and keep exactly the wheel and the sdist
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          mkdir pypi
          cp dist/runweave-*-py3-none-any.whl dist/runweave-*.tar.gz pypi/
          ls -l pypi
          test "$(find pypi -type f | wc -l)" -eq 2
      - name: Publish runweave to PyPI (trusted publishing, with attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi/

  publish-npm:
    needs: [build, install-check]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the checksums, and that npm is new enough for trusted publishing
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          printf '%s\n' 11.5.1 "$(npm --version)" | sort -V -C || { echo "npm $(npm --version) is older than 11.5.1"; exit 1; }
      - name: Publish runweave-agent with provenance
        env:
          # Set only for the first publish (docs/release.md): npm's trusted publishing is
          # configured on an existing package. Later, with no NPM_TOKEN, npm uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/runweave-agent-*.tgz --provenance --access public

  publish-image:
    needs: [build, install-check]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: service-image
          path: target/image
      - name: Push the verified image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${OWNER,,}/runweave:${RELEASE_TAG#v}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          gunzip -c target/image/runweave-service.tar.gz | docker load
          docker tag runweave-service:release "$image"
          docker push "$image"
          docker logout ghcr.io

  desktop:
    # The desktop installers for the tag, built and install-checked on all three systems.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/desktop.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

  draft-release:
    needs: [build, install-check, desktop]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: desktop
      - name: Add the desktop installers, notices and Rust SBOM
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          find desktop -path '*/bundle/*' -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg'             -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          cp desktop/desktop-ubuntu-latest/target/notices/THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES.txt
          cp desktop/desktop-ubuntu-latest/target/notices/runweave-desktop-rust.cdx.json dist/runweave-desktop-rust.cdx.json
          (cd dist && rm SHA256SUMS && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag             --title "RunWeave $RELEASE_TAG" --notes "Draft. Files are listed with their SHA-256 in SHA256SUMS; SBOMs are the .cdx.json files. The desktop installers are unsigned: see docs/desktop.md for first-launch steps."
