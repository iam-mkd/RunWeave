name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    env:
      PYDANTIC_AI_NO_BANNER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the TypeScript SDK for the shared contract suite
        run: npm ci && npm run build
        working-directory: sdk/typescript
      - name: Install the official Node SDKs for the proxy compatibility test
        run: npm ci
        working-directory: tests/proxy_compat
      - run: uv sync --locked --extra workflow --extra eval --extra durable
      - run: uv run --no-sync pytest -q
        env:
          RUNWEAVE_CONTRACT_REQUIRE_ALL: '1'
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy

  clean-install:
    name: Clean install from the wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the workspace UI that the wheel carries
        run: npm ci && npm run build
        working-directory: frontend
      - run: uv sync --locked
      - name: uvx runweave init, eval, bench and shadow (Python and TypeScript), then the UI's jobs
        run: uv run --no-sync python scripts/check-release.py --output target/release/check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clean-install-${{ matrix.os }}
          path: target/release/check.json

  typescript-sdk:
    name: TypeScript SDK on Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: actionlint (with shellcheck) on every workflow
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -no-color

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Audit Python dependencies with pip-audit
        run: |
          mkdir -p target/audit
          uv export --locked --all-extras --all-groups --no-hashes --no-emit-project \
            --format requirements-txt --output-file target/audit/requirements.txt
          for requirements in target/audit/requirements.txt requirements-durable.txt sandbox/requirements-browser.txt; do
            uvx --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r "$requirements"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit shipped frontend dependencies with npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=low
      - name: Audit TypeScript SDK dependencies (build tooling only; it has no runtime dependencies)
        working-directory: sdk/typescript
        run: npm audit --audit-level=low
      - name: Audit the proxy compatibility test's Node SDKs (test-only)
        working-directory: tests/proxy_compat
        run: npm audit --audit-level=low
      - name: Report frontend tooling advisories (accepted ones are listed in SECURITY.md)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=low
