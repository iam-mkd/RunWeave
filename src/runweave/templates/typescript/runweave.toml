# RunWeave project: `runweave eval` starts agent.mjs, runs the datasets, then stops it.
[agent]
name = "word-count"
command = ["node", "agent.mjs"]

[limits]
run_timeout_seconds = 30
concurrency = 4

[proxy]
mode = "mock"
fault_profile = ""
fault_seed = 0

[[datasets]]
name = "smoke"
path = "datasets/smoke.jsonl"

[eval]
min_pass_rate = 1.0

[bench]                # runweave bench: levels to sweep and runs per level
concurrency = [1, 4, 16]
runs = 32
# soak_seconds = 600
# max_failure_rate = 0.01

[shadow]               # runweave shadow: the version to compare with [agent]
# candidate = { command = ["node", "agent_v2.mjs"] }
