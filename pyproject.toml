[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "runweave"
version = "0.1.0"
description = "Bounded asynchronous execution for I/O-bound AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "keyring>=25,<26",
    "opentelemetry-sdk>=1.45.2,<2",
    "psutil>=7.2,<8",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt==2.15.1",
    "pyyaml>=6.0.2,<7",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
runweave-demo = "runweave.demo:main"
runweave = "runweave.cli:main"
runweave-workspace = "runweave.workspace:main"

[project.optional-dependencies]
workflow = [
    "pydantic-ai-slim==2.68.0",
    "pydantic-graph==2.68.0",
]
eval = [
    "pydantic-evals==2.68.0",
]

[dependency-groups]
dev = [
    "anthropic>=2.10,<3",
    "mypy>=1.14,<2",
    "openai>=3.55,<4",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "src/**/*.py" },
    { file = "src/**/*.json" },
]

[tool.setuptools.package-data]
"runweave" = [
    "sandbox_assets/*.json",
    "sandbox_assets/*LICENSE",
    "sandbox_assets/*.md",
    "templates/**/*",
    "templates/*/.gitignore",
    "workspace_ui/**/*",
]
"runweave.evaluation" = ["fixtures-v1.json", "fixtures-v2.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".uv-cache", ".uv-python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
# Sort the same everywhere (worktrees and checkouts can otherwise disagree).
known-first-party = ["runweave"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "benchmarks", "examples", "scripts/check-isolation.py", "scripts/check-container.py", "scripts/check-release.py", "scripts/measure-ui-overhead.py", "scripts/bundle-workspace-ui.py"]
